<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cybersec Tasks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f19;
      color: #f0f6fc;
      height: 100vh;
      overflow-y: auto;
      padding: 44px 16px 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .title { font-size: 17px; font-weight: 700; }
    .status-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      font-weight: 600;
    }
    .stats-card {
      background: #141c2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .stats-title { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
    .progress-bar {
      height: 6px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%;
      width: 75%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 999px;
      transition: width 0.3s;
    }
    .stats-footer { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; }
    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #111827;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .task-item:active { background: #172033; }
    .checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 12px;
      color: #fff;
    }
    .checkbox.checked {
      background: #38bdf8;
    }
    .checkbox.checked::after {
      content: '✓';
      font-weight: 700;
      color: #0b1329;
    }
    .task-text { font-size: 13px; font-weight: 500; }
    .task-sub { font-size: 11px; color: #64748b; margin-top: 2px; }
    .done { text-decoration: line-through; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">DevSecOps Tasks</div>
    <div class="status-pill">Pipeline Clean</div>
  </div>

  <div class="stats-card">
    <div class="stats-title">Sprint Security Compliance</div>
    <div class="progress-bar">
      <div class="progress-fill" id="fill"></div>
    </div>
    <div class="stats-footer">
      <span id="counter">3 of 4 completed</span>
      <span>75%</span>
    </div>
  </div>

  <div style="font-size: 13px; color: #94a3b8; margin-bottom: 10px; font-weight: 600;">Active Tasks</div>
  <div id="tasks">
    <div class="task-item" onclick="toggle(this)">
      <div class="checkbox checked"></div>
      <div>
        <div class="task-text done">SAST Code Review SonarQube</div>
        <div class="task-sub">Security gate passed</div>
      </div>
    </div>
    <div class="task-item" onclick="toggle(this)">
      <div class="checkbox checked"></div>
      <div>
        <div class="task-text done">OWASP Dependency Check</div>
        <div class="task-sub">0 critical CVEs found</div>
      </div>
    </div>
    <div class="task-item" onclick="toggle(this)">
      <div class="checkbox checked"></div>
      <div>
        <div class="task-text done">JWT Secret Rotation</div>
        <div class="task-sub">Keys validated in vault</div>
      </div>
    </div>
    <div class="task-item" onclick="toggle(this)">
      <div class="checkbox"></div>
      <div>
        <div class="task-text">DAST Scanning with OWASP ZAP</div>
        <div class="task-sub">Staging deployment test</div>
      </div>
    </div>
  </div>

  <script>
    function toggle(el) {
      const box = el.querySelector('.checkbox');
      const text = el.querySelector('.task-text');
      box.classList.toggle('checked');
      text.classList.toggle('done');
      
      const total = document.querySelectorAll('.task-item').length;
      const checked = document.querySelectorAll('.checkbox.checked').length;
      const pct = Math.round((checked / total) * 100);
      document.getElementById('fill').style.width = pct + '%';
      document.getElementById('counter').innerText = `${checked} of ${total} completed`;
    }
  </script>
</body>
</html>
