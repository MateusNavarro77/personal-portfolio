<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kriptum Wallet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #f0f6fc;
      height: 100vh;
      overflow-y: auto;
      padding: 44px 16px 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .network-badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-weight: 600;
    }
    .balance-card {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .balance-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
    .balance-amount { font-size: 32px; font-weight: 700; margin: 8px 0; color: #fff; }
    .balance-change { font-size: 12px; color: #4ade80; font-weight: 600; }
    .actions { display: flex; justify-content: space-around; gap: 10px; margin-bottom: 24px; }
    .btn {
      flex: 1;
      padding: 10px 0;
      border-radius: 12px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      text-align: center;
    }
    .btn:active { transform: scale(0.96); }
    .btn-send { background: #38bdf8; color: #0b1329; }
    .btn-receive { background: #1e293b; color: #f0f6fc; border: 1px solid rgba(255,255,255,0.1); }
    .section-title { font-size: 14px; color: #94a3b8; font-weight: 600; margin-bottom: 12px; }
    .token-list { display: flex; flex-col; gap: 10px; }
    .token-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #161b22;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .token-left { display: flex; align-items: center; gap: 12px; }
    .token-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #21262d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #38bdf8;
    }
    .token-name { font-size: 14px; font-weight: 600; }
    .token-sub { font-size: 11px; color: #8b949e; }
    .token-value { text-align: right; font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <div style="font-weight: 700; font-size: 16px;">Kriptum</div>
    <div class="network-badge">Ethereum Mainnet</div>
  </div>

  <div class="balance-card">
    <div class="balance-label">Total Balance</div>
    <div class="balance-amount" id="balance">$14,820.50</div>
    <div class="balance-change">+4.82% ($680.12) past 24h</div>
  </div>

  <div class="actions">
    <button class="btn btn-send" onclick="addTx()">+ Send</button>
    <button class="btn btn-receive" onclick="refresh()">Receive</button>
  </div>

  <div class="section-title">Assets</div>
  <div class="token-list">
    <div class="token-item">
      <div class="token-left">
        <div class="token-icon">Ξ</div>
        <div>
          <div class="token-name">Ethereum</div>
          <div class="token-sub">3.84 ETH</div>
        </div>
      </div>
      <div class="token-value">$9,620.40</div>
    </div>
    <div class="token-item">
      <div class="token-left">
        <div class="token-icon" style="color:#f59e0b;">₿</div>
        <div>
          <div class="token-name">Bitcoin</div>
          <div class="token-sub">0.08 BTC</div>
        </div>
      </div>
      <div class="token-value">$5,200.10</div>
    </div>
  </div>

  <script>
    let bal = 14820.50;
    function addTx() {
      bal -= 50;
      document.getElementById('balance').innerText = '$' + bal.toFixed(2);
    }
    function refresh() {
      bal += 100;
      document.getElementById('balance').innerText = '$' + bal.toFixed(2);
    }
  </script>
</body>
</html>
